
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>NightHub Key</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --bg: #070707;
  --panel: #101010;
  --gray: #a3a3a3;
  --white: #f5f5f5;
  --border: #303030;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  color-scheme: dark;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  padding: 22px;
  font-family: 'Inter', sans-serif;
  color: var(--white);
  background:
    radial-gradient(ellipse at 50% 45%, #292929 0%, #111 36%, #070707 75%);
}

/* ANIMATED BACKGROUND */

.background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.orb {
  position: absolute;
  width: 340px;
  height: 340px;
  border-radius: 50%;
  filter: blur(100px);
  opacity: .18;
  animation: orbMove 12s ease-in-out infinite alternate;
}

.orb.one {
  top: -150px;
  left: -100px;
  background: #aaa;
}

.orb.two {
  right: -120px;
  bottom: -150px;
  background: #666;
  animation-delay: -5s;
}

.orb.three {
  width: 200px;
  height: 200px;
  left: 45%;
  top: 60%;
  background: #444;
  animation-delay: -8s;
}

.grid {
  position: absolute;
  inset: 0;
  opacity: .13;
  background-image:
    linear-gradient(#777 1px, transparent 1px),
    linear-gradient(90deg, #777 1px, transparent 1px);
  background-size: 55px 55px;
  mask-image: linear-gradient(to bottom, transparent, black, transparent);
  animation: gridMove 20s linear infinite;
}

.scanline {
  position: absolute;
  left: 0;
  width: 100%;
  height: 100px;
  background: linear-gradient(
    transparent,
    #ffffff05,
    #ffffff0c,
    transparent
  );
  animation: scan 9s linear infinite;
}

.particle {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #ddd;
  box-shadow: 0 0 12px #fff;
  animation: particleFloat 8s ease-in-out infinite alternate;
}

.p1 { left: 12%; top: 24%; }
.p2 { left: 82%; top: 22%; animation-delay: -2s; }
.p3 { left: 75%; top: 76%; animation-delay: -4s; }
.p4 { left: 22%; top: 83%; animation-delay: -3s; }
.p5 { left: 50%; top: 12%; animation-delay: -6s; }
.p6 { left: 91%; top: 52%; animation-delay: -1s; }
.p7 { left: 8%; top: 59%; animation-delay: -5s; }

/* MAIN CARD */

.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  padding: 36px 28px 25px;
  border-radius: 23px;
  border: 1px solid #484848;
  background: linear-gradient(145deg, #171717ed, #090909f5);
  box-shadow:
    0 0 0 1px #ffffff05,
    0 25px 90px #000b,
    0 0 45px #ffffff08,
    inset 0 1px 0 #ffffff10;
  text-align: center;
  animation: cardEnter .9s cubic-bezier(.2,.8,.2,1) both,
             cardGlow 5s ease-in-out 1s infinite;
}

.card::before {
  content: "";
  position: absolute;
  top: -1px;
  left: 15%;
  width: 70%;
  height: 1px;
  background: linear-gradient(90deg, transparent, #eee, transparent);
  box-shadow: 0 0 15px #fff;
  animation: lightTravel 4s linear infinite;
}

.card::after {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(
    125deg,
    #777,
    transparent 25%,
    #444 50%,
    transparent 75%,
    #999
  );
  background-size: 250% 250%;
  animation: borderFlow 8s linear infinite;
  pointer-events: none;
  opacity: .35;
  mask: linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
  mask-composite: exclude;
}

/* TITLE */

.brand {
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 6px;
  color: #999;
  margin-bottom: 19px;
  animation: fadeUp .8s .15s both;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(25px, 6vw, 34px);
  font-weight: 800;
  letter-spacing: -1px;
  color: #fff;
  text-shadow: 0 0 25px #ffffff22;
  animation: titleGlow 4s ease-in-out infinite;
}

.subtitle {
  margin-top: 13px;
  color: #8d8d8d;
  font-size: 13px;
  line-height: 1.8;
  animation: fadeUp .8s .25s both;
}

.heading-line {
  width: 90px;
  height: 2px;
  margin: 22px auto;
  background: linear-gradient(90deg, transparent, #ccc, transparent);
  animation: linePulse 3s ease-in-out infinite;
}

/* STATUS */

.status {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 9px 15px;
  margin-bottom: 28px;
  border: 1px solid #444;
  border-radius: 30px;
  background: #ffffff05;
  color: #d4d4d4;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ddd;
  box-shadow: 0 0 10px #fff;
  animation: blink 1.5s infinite;
}

/* HORIZONTAL KEY */

.label {
  text-align: left;
  margin-bottom: 11px;
  color: #aaa;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
}

.key-box {
  width: 100%;
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  gap: 8px;
  min-width: 0;
  padding: 15px 12px;
  border: 1px solid #454545;
  border-radius: 12px;
  background: #080808;
  box-shadow: inset 0 0 18px #ffffff04;
  transition: border-color .3s, box-shadow .3s;
}

.key-box:hover {
  border-color: #aaa;
  box-shadow: 0 0 20px #ffffff0b;
}

.key-text {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
  text-align: left;
  color: #eee;
  font-family: 'Inter', sans-serif;
  font-size: clamp(10px, 2.7vw, 13px);
  font-weight: 600;
  letter-spacing: -.25px;
  user-select: text;
}

.key-text::-webkit-scrollbar {
  display: none;
}

.icon-copy {
  flex: 0 0 29px;
  height: 29px;
  display: grid;
  place-items: center;
  border: 1px solid #454545;
  border-radius: 7px;
  color: #eee;
  background: #1a1a1a;
  cursor: pointer;
  font-size: 17px;
  transition: .25s;
}

.icon-copy:hover {
  background: #333;
  border-color: #aaa;
  transform: scale(1.06);
}

/* BUTTON */

.copy-btn {
  position: relative;
  overflow: hidden;
  width: 100%;
  margin-top: 15px;
  padding: 16px;
  border: 1px solid #777;
  border-radius: 12px;
  background: linear-gradient(110deg, #eeeeee, #999999, #eeeeee);
  background-size: 200% auto;
  color: #080808;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2px;
  cursor: pointer;
  transition: transform .25s, box-shadow .25s;
  animation: buttonShine 5s linear infinite;
}

.copy-btn::before {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 70%;
  height: 100%;
  background: linear-gradient(90deg, transparent, #fff9, transparent);
  transform: skewX(-20deg);
  animation: buttonSweep 4s ease-in-out infinite;
}

.copy-btn span {
  position: relative;
  z-index: 1;
}

.copy-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 30px #ffffff20;
}

.copy-btn:active {
  transform: scale(.98);
}

.message {
  min-height: 20px;
  margin-top: 12px;
  color: #ddd;
  font-size: 12px;
}

.divider {
  height: 1px;
  margin: 24px 0 18px;
  background: linear-gradient(90deg, transparent, #444, transparent);
}

.footer {
  color: #686868;
  font-size: 10px;
  letter-spacing: 2px;
}

.footer strong {
  color: #ddd;
  font-weight: 700;
}

/* ANIMATIONS */

@keyframes cardEnter {
  from { opacity: 0; transform: translateY(35px) scale(.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes cardGlow {
  0%, 100% { box-shadow: 0 25px 90px #000b, 0 0 25px #ffffff05; }
  50% { box-shadow: 0 25px 90px #000b, 0 0 40px #ffffff10; }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes titleGlow {
  0%, 100% { text-shadow: 0 0 15px #ffffff10; }
  50% { text-shadow: 0 0 28px #ffffff30; }
}

@keyframes linePulse {
  0%, 100% { opacity: .45; transform: scaleX(.8); }
  50% { opacity: 1; transform: scaleX(1.1); }
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: .3; }
}

@keyframes orbMove {
  from { transform: translate(0, 0) scale(.9); }
  to { transform: translate(100px, 70px) scale(1.2); }
}

@keyframes gridMove {
  from { transform: translateY(0); }
  to { transform: translateY(55px); }
}

@keyframes scan {
  from { top: -120px; }
  to { top: 110%; }
}

@keyframes particleFloat {
  from { transform: translate(0, 0); opacity: .2; }
  to { transform: translate(25px, -35px); opacity: .9; }
}

@keyframes lightTravel {
  0%, 100% { opacity: .3; transform: scaleX(.5); }
  50% { opacity: 1; transform: scaleX(1); }
}

@keyframes borderFlow {
  0% { background-position: 0% 50%; }
  100% { background-position: 250% 50%; }
}

@keyframes buttonShine {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

@keyframes buttonSweep {
  0%, 65% { left: -100%; }
  90%, 100% { left: 150%; }
}

@media (max-width: 380px) {
  body { padding: 12px; }
  .card { padding: 30px 16px 22px; }
  .key-box { padding: 12px 8px; gap: 5px; }
  .key-text { font-size: 10px; }
  .brand { letter-spacing: 4px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<div class="background">
  <div class="grid"></div>
  <div class="scanline"></div>
  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>
  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>
  <div class="particle p5"></div>
  <div class="particle p6"></div>
  <div class="particle p7"></div>
</div>

<main class="card">

  <div class="brand">N I G H T H U B</div>

  <h1>NightHub Key</h1>

  <p class="subtitle">
    Welcome to the NightHub key portal.<br>
    Your key is ready to copy.
  </p>

  <div class="heading-line"></div>

  <div class="status">
    <span class="status-dot"></span>
    KEY SYSTEM
  </div>

  <div class="label">YOUR ACCESS KEY</div>

  <div class="key-box">
    <div class="key-text" id="keyText"
         title="NightHubKeyJakwowo - Kalwpowhekeosoekeji">NightHubKeyJakwowo - Kalwpowhekeosoekeji</div>

    <button class="icon-copy" onclick="copyKey()"
            aria-label="Copy key" title="Copy key">▢</button>
  </div>

  <button class="copy-btn" id="copyBtn" onclick="copyKey()">
    <span>▣ &nbsp; COPY KEY</span>
  </button>

  <p class="message" id="message" aria-live="polite"></p>

  <div class="divider"></div>

  <div class="footer">
    POWERED BY <strong>NIGHTHUB</strong>
  </div>

</main>

<script>
const KEY_VALUE = "NightHubKeyJakwowo - Kalwpowhekeosoekeji";

async function copyKey() {
  const message = document.getElementById("message");
  const button = document.getElementById("copyBtn");

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(KEY_VALUE);
    } else {
      const textarea = document.createElement("textarea");
      textarea.value = KEY_VALUE;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      const success = document.execCommand("copy");
      textarea.remove();

      if (!success) throw new Error("Copy failed");
    }

    message.textContent = "✓ Key copied successfully!";
    button.querySelector("span").textContent = "✓  COPIED SUCCESSFULLY";

    setTimeout(() => {
      button.querySelector("span").textContent = "▣  COPY KEY";
      message.textContent = "";
    }, 2200);

  } catch (error) {
    message.textContent = "Copy failed. Please select and copy the key manually.";
  }
}
</script>

</body>
</html>
